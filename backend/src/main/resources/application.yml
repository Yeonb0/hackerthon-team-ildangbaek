spring:
  application:
    name: backend
  profiles:
    active: local
  servlet:
    multipart:
      # SKIN-01 이미지 상한(10MB)에 맞춘다. 기본값(파일 1MB)이면 정상 사진도 튕긴다.
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  storage:
    local:
      directory: ${STORAGE_LOCAL_DIR:./uploads/images}
      url-prefix: ${STORAGE_LOCAL_URL_PREFIX:/images/}
  skin:
    analysis:
      provider: ${SKIN_ANALYSIS_PROVIDER:mock}
      openai:
        api-key: ${OPENAI_API_KEY:}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      local-vision:
        base-url: ${LOCAL_VISION_BASE_URL:http://localhost:8000}
