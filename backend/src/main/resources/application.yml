spring:
  application:
    name: backend
  profiles:
    active: local
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      # SKIN-01 이미지 상한(10MB)에 맞춘다. 기본값(파일 1MB)이면 정상 사진도 튕긴다.
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  auth:
    # 목업 토큰(mock-access-*, mock-refresh-*) 서명용 HMAC 비밀키. 로컬 개발 편의를 위한
    # 기본값이며, 실제 배포 환경에서는 반드시 MOCK_TOKEN_SECRET을 별도로 설정해야 한다.
    mock-token-secret: ${MOCK_TOKEN_SECRET:local-dev-only-mock-token-secret-change-me}
  storage:
    local:
      directory: ${STORAGE_LOCAL_DIR:./uploads/images}
      url-prefix: ${STORAGE_LOCAL_URL_PREFIX:/images/}
      public-base-url: ${PUBLIC_BASE_URL:}
  location:
    kakao:
      base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
      rest-api-key: ${KAKAO_REST_API_KEY:}
  weather:
    kma:
      base-url: ${KMA_WEATHER_BASE_URL:http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
      uv-base-url: ${KMA_UV_BASE_URL:http://apis.data.go.kr/1360000/LivingWthrIdxServiceV4}
      service-key: ${KMA_WEATHER_SERVICE_KEY:}
  skin:
    analysis:
      # mock | local-vision. OpenAI Vision은 local-vision(ai-server) 내부에서 2차 확정
      # 단계로만 호출된다(ADR 0022) — Spring이 직접 OpenAI를 호출하지 않는다.
      provider: ${SKIN_ANALYSIS_PROVIDER:local-vision}
      local-vision:
        base-url: ${LOCAL_VISION_BASE_URL:http://localhost:8000}
