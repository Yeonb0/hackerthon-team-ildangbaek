services:
  mysql:
    image: mysql:8.0
    container_name: ildangbaek-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ildangbaek
      MYSQL_USER: ildangbaek
      MYSQL_PASSWORD: ildangbaek1234
      MYSQL_ROOT_PASSWORD: root1234
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql-data:
